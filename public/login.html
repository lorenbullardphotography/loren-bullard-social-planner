<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Loren Bullard Content Planner</title>
  <style>
    *{box-sizing:border-box}.hidden{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee8;color:#302b27;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(400px,calc(100% - 32px));padding:34px;border-radius:24px;background:#fff;box-shadow:0 18px 55px #4b36251c}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#302b27;color:#fff;font:22px Georgia;margin-bottom:22px}.eyebrow{margin:0 0 8px;color:#9b6d4f;font-size:11px;font-weight:700;letter-spacing:.14em}.card h1{margin:0 0 8px;font:30px Georgia,serif}.sub{margin:0 0 18px;color:#756d66;line-height:1.5}.field{display:grid;gap:8px;font-size:13px;font-weight:700;margin-top:12px}.field input,.field select{width:100%;padding:13px;border:1px solid #d8d0c8;border-radius:10px;font:inherit;background:#fff}.button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#302b27;color:#fff;font-weight:700;cursor:pointer}.error{min-height:20px;margin-top:12px;color:#a33c35;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#f3eee8;border-radius:10px}.tab{border:0;background:transparent;padding:9px;border-radius:7px;color:#756d66;cursor:pointer;font-weight:700}.tab.active{background:#fff;color:#302b27;box-shadow:0 1px 4px #4b36251c}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">LB</div>
    <p class="eyebrow">SHARED WORKSPACE</p>
    <h1>Content Planner</h1>
    <p class="sub" id="intro">Sign in to access the shared Instagram planner.</p>
    <div class="tabs"><button type="button" class="tab active" data-mode="login">Sign in</button><button type="button" class="tab" data-mode="register">Create account</button></div>
    <form id="loginForm">
      <label class="field hidden" id="nameField">Display name<input id="name" maxlength="80" autocomplete="name" placeholder="Loren"></label>
      <label class="field hidden" id="roleField">Role<select id="role"><option>Photographer</option><option>Social Media Manager</option><option>Assistant</option><option>Editor</option></select></label>
      <label class="field" id="loginField">Display name<input id="login" autocomplete="username" required autofocus placeholder="Loren"></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit" id="submit">Sign in</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
