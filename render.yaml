services:
  - type: web
    name: loren-content-planner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATA_DIR
        value: /var/data
      - key: PLANNER_PASSWORD
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: META_API_VERSION
        value: v25.0
    disk:
      name: loren-content-planner-data
      mountPath: /var/data
      sizeGB: 1
